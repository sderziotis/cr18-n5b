---
# ============================================================================
#  cr-18-n5b — Multi-Tier Network Pivoting (Capstone)
# ============================================================================


# ----------------------------------------------------------------------------
#  Shared prep applied to EVERY machine (all hosts + router)
# ----------------------------------------------------------------------------
- name: Common base setup
  hosts: attacker,dmzhost,appserver,nfsserver,mgmthost,router
  become: true
  gather_facts: true
  tasks:
    - name: Disable and mask unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
        enabled: false
        masked: true
      failed_when: false

    - name: Wait for apt/dpkg lock
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 3; done
      changed_when: false
      failed_when: false

    - name: Ensure OpenSSH server present and running
      ansible.builtin.apt:
        name: openssh-server
        state: present
        update_cache: true

    - name: Start SSH
      ansible.builtin.systemd:
        name: ssh
        state: started
        enabled: true
      failed_when: false


# ----------------------------------------------------------------------------
#  DMZ HOST (10.10.10.2 / 10.10.20.2)
#    * Samba guest share leaks dmzadmin's SSH private key + a note
#    * SSH accepts that key for dmzadmin
#    * dual-homed; forwarding tooling present (trainee enables the pivot)
# ----------------------------------------------------------------------------
- name: Provision dmzhost (SMB entry + first pivot)
  hosts: dmzhost
  become: true
  gather_facts: true
  handlers:
    - name: Restart smbd
      ansible.builtin.systemd:
        name: smbd
        state: restarted
  tasks:
    - name: Install Samba, ssh client, NFS client
      ansible.builtin.apt:
        name:
          - samba
          - openssh-client
          - nfs-common
        state: present
        update_cache: true

    - name: Create dmzadmin user
      ansible.builtin.user:
        name: dmzadmin
        shell: /bin/bash
        create_home: true

    - name: Create dmzadmin .ssh dir
      ansible.builtin.file:
        path: /home/dmzadmin/.ssh
        state: directory
        owner: dmzadmin
        group: dmzadmin
        mode: '0700'

    - name: Generate dmzadmin keypair
      ansible.builtin.command:
        cmd: ssh-keygen -t rsa -b 2048 -N "" -C "dmzadmin@dmzhost" -f /home/dmzadmin/.ssh/id_rsa
        creates: /home/dmzadmin/.ssh/id_rsa

    - name: Fix key ownership/permissions
      ansible.builtin.file:
        path: "{{ item.p }}"
        owner: dmzadmin
        group: dmzadmin
        mode: "{{ item.m }}"
      loop:
        - { p: /home/dmzadmin/.ssh/id_rsa, m: '0600' }
        - { p: /home/dmzadmin/.ssh/id_rsa.pub, m: '0644' }

    - name: Authorize dmzadmin's own key for login
      ansible.builtin.copy:
        src: /home/dmzadmin/.ssh/id_rsa.pub
        dest: /home/dmzadmin/.ssh/authorized_keys
        remote_src: true
        owner: dmzadmin
        group: dmzadmin
        mode: '0600'

    # --- the leaky SMB share ------------------------------------------------
    - name: Create SMB share directory
      ansible.builtin.file:
        path: /srv/public
        state: directory
        mode: '0777'

    - name: Copy the private key into the public share (the leak)
      ansible.builtin.copy:
        src: /home/dmzadmin/.ssh/id_rsa
        dest: /srv/public/id_rsa
        remote_src: true
        mode: '0644'

    - name: Drop a note naming the key owner
      ansible.builtin.copy:
        dest: /srv/public/README.txt
        mode: '0644'
        content: |
          Backup of dmzadmin's access key. Do not distribute.
          Use it to log into this host as 'dmzadmin' if you get locked out.

    - name: Drop the A3 flag in the share (proves discovery of the leak)
      ansible.builtin.copy:
        dest: /srv/public/smb_flag.txt
        mode: '0644'
        content: "smb_flag: {{ smb_flag }}\n"

    - name: Configure Samba with a guest-readable share
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf
        mode: '0644'
        content: |
          [global]
             workgroup = WORKGROUP
             server string = DMZ File Server
             map to guest = Bad User
             security = user
             guest account = nobody

          [public]
             path = /srv/public
             browseable = yes
             read only = yes
             guest ok = yes
      notify: Restart smbd

    - name: Enable and start smbd
      ansible.builtin.systemd:
        name: smbd
        state: started
        enabled: true

    # Pivoting is done via ligolo-ng (application-layer relay), not kernel
    # IP forwarding — raw forwarding+MASQUERADE was tested and found to be
    # silently dropped by the platform's Neutron anti-spoofing on the NAT
    # return path (the un-NAT'd reply carries a source IP the DMZ port never
    # owns). ligolo-ng avoids this: the agent originates its own outbound
    # connection to the target using its own legitimate IP, so nothing ever
    # appears on the wire with a foreign source address.
    - name: Ensure tar is present (needed to unpack the agent)
      ansible.builtin.apt:
        name: tar
        state: present

    - name: Create ligolo-ng directory
      ansible.builtin.file:
        path: /opt/ligolo
        state: directory
        mode: '0755'

    - name: Download the ligolo-ng agent (v0.9.1, linux/amd64)
      ansible.builtin.get_url:
        url: https://github.com/nicocha30/ligolo-ng/releases/download/v0.9.1/ligolo-ng_agent_0.9.1_linux_amd64.tar.gz
        dest: /opt/ligolo/agent.tar.gz
        mode: '0644'
      register: ligolo_agent_download
      failed_when: false

    - name: Unpack the agent
      ansible.builtin.unarchive:
        src: /opt/ligolo/agent.tar.gz
        dest: /opt/ligolo
        remote_src: true
      when: ligolo_agent_download is succeeded

    - name: Ensure the agent binary is executable
      ansible.builtin.file:
        path: /opt/ligolo/agent
        mode: '0755'
      failed_when: false

    # --- A4: local escalation path (narrow, realistic misconfiguration) -----
    # dmzadmin has NO general sudo. It can run exactly one script as root
    # (NOPASSWD), framed as a network-diagnostics tool an admin plausibly
    # needs. That script is world-writable — the actual misconfiguration.
    - name: Create the netcheck script directory
      ansible.builtin.file:
        path: /opt/netcheck
        state: directory
        mode: '0755'

    - name: Deploy the (intentionally writable) netcheck script
      ansible.builtin.copy:
        dest: /opt/netcheck/netcheck.sh
        mode: '0777'
        content: |
          #!/bin/bash
          # Quick connectivity/interface check for on-call network admins.
          echo "== interfaces =="
          ip -brief a
          echo "== routes =="
          ip route

    - name: Grant dmzadmin NOPASSWD sudo on the netcheck script only
      ansible.builtin.copy:
        dest: /etc/sudoers.d/netcheck
        mode: '0440'
        validate: 'visudo -cf %s'
        content: |
          dmzadmin ALL=(ALL) NOPASSWD: /opt/netcheck/netcheck.sh

    # dmz_root_flag is placed AFTER escalation is possible, root-only, so it
    # can only be read once the trainee actually becomes root via the script.
    - name: Place the A4 flag (root-only, proves local escalation)
      ansible.builtin.copy:
        dest: /root/dmz_root_flag.txt
        owner: root
        group: root
        mode: '0600'
        content: "dmz_root_flag: {{ dmz_root_flag }}\n"


# ----------------------------------------------------------------------------
#  NFS SERVER (10.10.20.30 / 10.10.30.30)
#    * exports /srv/share with no_root_squash (the trust-abuse mechanic)
#    * root_flag readable only by root (reward for the escalation)
#    * dual-homed; bridges Internal -> Management
# ----------------------------------------------------------------------------
- name: Provision nfsserver (NFS trust + second pivot)
  hosts: nfsserver
  become: true
  gather_facts: true
  handlers:
    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: false
  tasks:
    - name: Install NFS server + cron
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - cron
        state: present
        update_cache: true

    - name: Ensure cron service is running
      ansible.builtin.systemd:
        name: cron
        state: started
        enabled: true

    - name: Create the exported share
      ansible.builtin.file:
        path: /srv/share
        state: directory
        mode: '0777'

    - name: Seed a benign file in the share
      ansible.builtin.copy:
        dest: /srv/share/welcome.txt
        mode: '0644'
        content: |
          Shared scratch space for internal automation.

    # nfs_flag: lives INSIDE the exported share, owned root:root, mode 600.
    # A normal client cannot read it. Because the export is no_root_squash,
    # an attacker who becomes root on ANY client that mounts the share CAN
    # read it directly (root on client == root on the export). This is what
    # makes the flag placement match the actual trust-abuse mechanic.
    - name: Place the A6 flag inside the share (root-only)
      ansible.builtin.copy:
        dest: /srv/share/.nfs_flag
        owner: root
        group: root
        mode: '0600'
        content: "nfs_flag: {{ nfs_flag }}\n"

    - name: Configure the misconfigured export (no_root_squash)
      ansible.builtin.copy:
        dest: /etc/exports
        mode: '0644'
        content: |
          /srv/share 10.10.20.0/24(rw,sync,no_subtree_check,no_root_squash)
      notify: Reload NFS exports

    - name: Enable and start NFS server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: started
        enabled: true

    # --- A7 entry mechanism: root cron job executes a script from the share --
    # This is the realistic completion of the no_root_squash trust abuse:
    # nfsserver runs routine "sync check" automation as root, reading a
    # script FROM the share it exports. Because no_root_squash lets an
    # attacker root on any client write root-owned files onto that share,
    # they can plant a payload here and wait for nfsserver's own automation
    # to execute it as root — no separate credential onto nfsserver needed.
    - name: Create the placeholder sync-check script (empty, root-owned)
      ansible.builtin.copy:
        dest: /srv/share/.sync-check.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          # Routine sync/consistency check — invoked by cron. Placeholder.
          exit 0
        force: false
      # force: false -> do NOT overwrite if the trainee has already replaced
      # it during testing/redeploy; only creates it if missing.

    - name: Install the root cron job that runs the sync-check script
      ansible.builtin.cron:
        name: "internal sync check"
        user: root
        minute: "*"
        job: "/bin/bash /srv/share/.sync-check.sh >/dev/null 2>&1"

    # --- second-hop pivot tooling: ligolo-ng agent (Internal -> Management) --
    - name: Ensure tar is present (needed to unpack the agent)
      ansible.builtin.apt:
        name: tar
        state: present

    - name: Create ligolo-ng directory
      ansible.builtin.file:
        path: /opt/ligolo
        state: directory
        mode: '0755'

    - name: Download the ligolo-ng agent (v0.9.1, linux/amd64)
      ansible.builtin.get_url:
        url: https://github.com/nicocha30/ligolo-ng/releases/download/v0.9.1/ligolo-ng_agent_0.9.1_linux_amd64.tar.gz
        dest: /opt/ligolo/agent.tar.gz
        mode: '0644'
      register: ligolo_agent_download
      failed_when: false

    - name: Unpack the agent
      ansible.builtin.unarchive:
        src: /opt/ligolo/agent.tar.gz
        dest: /opt/ligolo
        remote_src: true
      when: ligolo_agent_download is succeeded

    - name: Ensure the agent binary is executable
      ansible.builtin.file:
        path: /opt/ligolo/agent
        mode: '0755'
      failed_when: false


# ----------------------------------------------------------------------------
#  APP SERVER (10.10.20.20)
#    * mounts the NFS share -> demonstrates the live trust relationship
# ----------------------------------------------------------------------------
- name: Provision appserver (NFS client)
  hosts: appserver
  become: true
  gather_facts: true
  tasks:
    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true

    - name: Create mount point
      ansible.builtin.file:
        path: /mnt/share
        state: directory
        mode: '0755'

    - name: Mount the NFS share at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/mnt-share.mount
        mode: '0644'
        content: |
          [Unit]
          Description=Mount internal NFS share
          After=network-online.target
          Wants=network-online.target

          [Mount]
          What=10.10.20.30:/srv/share
          Where=/mnt/share
          Type=nfs
          Options=rw

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the mount
      ansible.builtin.systemd:
        name: mnt-share.mount
        state: started
        enabled: true
        daemon_reload: true
      failed_when: false

    # --- A5 flag: only reachable once the DMZ->Internal pivot is live -------
    - name: Install python3 for the pivot-proof service
      ansible.builtin.apt:
        name: python3
        state: present
        update_cache: true

    - name: Deploy the pivot-proof flag service
      ansible.builtin.copy:
        dest: /opt/pivot_service.py
        mode: '0644'
        content: |
          import http.server, socketserver

          FLAG = "{{ pivot_flag }}"

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(
                      ("Internal app server.\npivot_flag: %s\n" % FLAG).encode()
                  )
              def log_message(self, *a):
                  return

          with socketserver.TCPServer(("0.0.0.0", 8080), H) as s:
              s.serve_forever()

    - name: Create systemd unit for the pivot-proof service
      ansible.builtin.copy:
        dest: /etc/systemd/system/pivot-service.service
        mode: '0644'
        content: |
          [Unit]
          Description=Internal Pivot Proof Service
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/pivot_service.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the pivot-proof service
      ansible.builtin.systemd:
        name: pivot-service
        state: started
        enabled: true
        daemon_reload: true


# ----------------------------------------------------------------------------
#  MANAGEMENT HOST (10.10.30.100)
#    * restricted network service serving mgmt_flag (final objective)
#    * reachable only from the Internal tier
# ----------------------------------------------------------------------------
- name: Provision mgmthost (final target)
  hosts: mgmthost
  become: true
  gather_facts: true
  tasks:
    - name: Install python3 + iptables
      ansible.builtin.apt:
        name:
          - python3
          - iptables
        state: present
        update_cache: true

    - name: Deploy the restricted flag service
      ansible.builtin.copy:
        dest: /opt/mgmt_service.py
        mode: '0644'
        content: |
          import http.server, socketserver

          FLAG = "{{ mgmt_flag }}"

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(
                      ("Management console.\nmgmt_flag: %s\n" % FLAG).encode()
                  )
              def log_message(self, *a):
                  return

          with socketserver.TCPServer(("0.0.0.0", 8080), H) as s:
              s.serve_forever()

    - name: Create systemd unit for the service
      ansible.builtin.copy:
        dest: /etc/systemd/system/mgmt-service.service
        mode: '0644'
        content: |
          [Unit]
          Description=Management Flag Service
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 /opt/mgmt_service.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the service
      ansible.builtin.systemd:
        name: mgmt-service
        state: started
        enabled: true
        daemon_reload: true


# ----------------------------------------------------------------------------
#  ATTACKER (10.10.10.10)
#    * standard pentest tooling for the chain
# ----------------------------------------------------------------------------
- name: Provision attacker (trainee console)
  hosts: attacker
  become: true
  gather_facts: true
  roles:
    - role: user-access
      user_access_username: pentester
      user_access_password: 'pentester'
      user_access_sudo: true
  tasks:
    - name: Wait for apt/dpkg lock
      ansible.builtin.shell: >
        while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
        /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 3; done
      changed_when: false
      failed_when: false

    - name: Install pentest tooling for the chain
      ansible.builtin.apt:
        name:
          - nmap
          - smbclient
          - cifs-utils
          - nfs-common
          - openssh-client
          - curl
          - iproute2
          - tar
          - tmux
        state: present
        update_cache: true

    # --- pivot tooling: ligolo-ng proxy (control console + tun interface) ----
    - name: Create ligolo-ng directory
      ansible.builtin.file:
        path: /opt/ligolo
        state: directory
        mode: '0755'

    - name: Download the ligolo-ng proxy (v0.9.1, linux/amd64)
      ansible.builtin.get_url:
        url: https://github.com/nicocha30/ligolo-ng/releases/download/v0.9.1/ligolo-ng_proxy_0.9.1_linux_amd64.tar.gz
        dest: /opt/ligolo/proxy.tar.gz
        mode: '0644'
      register: ligolo_proxy_download
      failed_when: false

    - name: Unpack the proxy
      ansible.builtin.unarchive:
        src: /opt/ligolo/proxy.tar.gz
        dest: /opt/ligolo
        remote_src: true
      when: ligolo_proxy_download is succeeded

    - name: Ensure the proxy binary is executable
      ansible.builtin.file:
        path: /opt/ligolo/proxy
        mode: '0755'
      failed_when: false


# ----------------------------------------------------------------------------
#  ROUTER — enforces tier segmentation (this is what forces the pivots)
#    Policy:
#      DMZ  (10.10.10.0/24) may NOT reach Internal or Management directly.
#      Internal (10.10.20.0/24) may reach Management, NOT initiate to DMZ.
#      Management (10.10.30.0/24) is the crown jewels: only reachable from Internal.
#    The router FORWARD chain is set to default-drop with only the allowed
#    inter-tier flows permitted. Because the attacker sits in the DMZ, it cannot
#    route to Internal/Management through the router at all -> it MUST pivot
#    through the dual-homed hosts (dmzhost, then nfsserver).
# ----------------------------------------------------------------------------
- name: Configure router segmentation
  hosts: router
  become: true
  gather_facts: true
  tasks:
    - name: Ensure iptables is present
      ansible.builtin.apt:
        name: iptables
        state: present
        update_cache: true
      failed_when: false

    - name: Enable IP forwarding on the router
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    # --- FORWARD chain: default drop, then allow only the intended flows -----
    - name: Flush existing FORWARD rules
      ansible.builtin.iptables:
        chain: FORWARD
        flush: true

    - name: Allow established/related return traffic
      ansible.builtin.iptables:
        chain: FORWARD
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    # Internal -> Management (the only permitted "deeper" transit)
    - name: Allow Internal to reach Management
      ansible.builtin.iptables:
        chain: FORWARD
        source: 10.10.20.0/24
        destination: 10.10.30.0/24
        jump: ACCEPT

    # DMZ -> Internal is intentionally NOT allowed through the router.
    # DMZ -> Management is intentionally NOT allowed through the router.
    # (The trainee bypasses this by pivoting through the dual-homed hosts,
    #  whose traffic egresses the pivot host's OWN interface on the next tier,
    #  not as router-forwarded transit from the DMZ.)

    - name: Drop all other inter-tier forwarding
      ansible.builtin.iptables:
        chain: FORWARD
        jump: DROP

    - name: Persist iptables rules (best effort)
      ansible.builtin.shell: |
        mkdir -p /etc/iptables
        iptables-save > /etc/iptables/rules.v4
      changed_when: false
      failed_when: false


# ----------------------------------------------------------------------------
#  Belt-and-suspenders: fully disable apt auto-update/upgrade on ALL hosts.
#  (Common base setup already disables the unattended-upgrades service; this
#  additionally blanks the periodic-update config and stops/masks the
#  apt-daily timers so nothing re-triggers apt mid-lab.)
# ----------------------------------------------------------------------------
- name: Disable apt auto-update everywhere
  hosts: attacker,dmzhost,appserver,nfsserver,mgmthost,router,man
  become: true
  tasks:
    - name: Disable unattended upgrades in apt periodic config
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable apt daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
      failed_when: false
